<!doctype html><html lang="en" data-theme="sage"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f3ef"><title>Order management · Parcel</title><link rel="stylesheet" href="{{url_for('static', filename='app.css')}}"><script src="{{url_for('static', filename='app.js')}}" defer></script></head><body><header><a class="brand" href="{{url_for('index')}}"><span class="brand-mark">↗</span><span>parcel<small>ORDER CONTROL</small></span></a><nav>{% if session.uid and user %}<a href="{{url_for('index')}}">Übersicht</a><a href="{{url_for('new_order')}}">Neue Bestellung</a>{% if user and user['admin'] %}<a href="{{url_for('settings')}}">Einstellungen</a>{% else %}<a href="{{url_for('password')}}">Passwort</a>{% endif %}<span class="account-identity" aria-label="Angemeldet als {{user.display_name or user.username}}"><strong>{{user.display_name or user.username}}</strong><small>@{{user.username}}</small></span><form class="inline" method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf" value="{{csrf}}"><button class="secondary">Abmelden ↗</button></form>{% endif %}<div class="theme-picker"><button type="button" class="theme-toggle" id="theme-toggle" aria-label="Farbschema ändern" title="Farbschema ändern" aria-expanded="false">🖌</button><div class="theme-menu" id="theme-menu" role="group" aria-label="Farbschema" hidden><div class="theme-menu-title">Farbschema</div><button type="button" class="theme-option" data-theme-choice="sage" aria-pressed="false"><span class="theme-swatch swatch-sage"></span><span>Sage</span><span class="theme-check">✓</span></button><button type="button" class="theme-option" data-theme-choice="ocean" aria-pressed="false"><span class="theme-swatch swatch-ocean"></span><span>Ocean</span><span class="theme-check">✓</span></button><button type="button" class="theme-option" data-theme-choice="lavender" aria-pressed="false"><span class="theme-swatch swatch-lavender"></span><span>Lavender</span><span class="theme-check">✓</span></button><button type="button" class="theme-option" data-theme-choice="dark" aria-pressed="false"><span class="theme-swatch swatch-dark"></span><span>Dunkel</span><span class="theme-check">✓</span></button></div></div><button type="button" class="language-toggle" id="language-toggle">DE</button></nav></header><main>{% for m in get_flashed_messages() %}<div class="alert">{{m}}</div>{% endfor %}{{content|safe}}</main></body></html>
