<div class="card" style="max-width:500px;margin:48px auto">
  <div class="eyebrow">Konto erstellen</div>
  <h1>Registrierung</h1>
  <p class="subtitle">Ein Administrator muss das Konto vor der ersten Anmeldung freischalten.</p>
  <form method="post" class="register-form">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <label>Name *</label><input name="display_name" maxlength="120" autocomplete="name" value="{{display_name}}" required autofocus>
    <label>Benutzername *</label><input name="username" minlength="3" maxlength="80" pattern="[A-Za-z0-9._-]+" autocomplete="username" value="{{username}}" required>
    <label>Rolle *</label><select name="role" required><option value="employee" {% if role=='employee' %}selected{% endif %}>Mitarbeiter</option><option value="external" {% if role=='external' %}selected{% endif %}>Extern</option></select>
    <label>Passwort * (mindestens 12 Zeichen)</label><input type="password" name="password" minlength="12" autocomplete="new-password" required>
    <label>Passwort wiederholen *</label><input type="password" name="password_confirm" minlength="12" autocomplete="new-password" required>
    <p><button class="btn primary">Registrierung absenden</button></p>
  </form>
  <p class="register-login"><a href="{{url_for('login')}}">Zur Anmeldung</a></p>
</div>
