<h1>{{'Bestellung bearbeiten' if o else 'Neue Bestellung / Warenkorb'}}</h1><form method="post" class="card"><input type="hidden" name="csrf" value="{{csrf}}"><div class="grid"><div><label>Bezeichnung *</label><input name="title" required maxlength="200" value="{{o.title if o else ''}}"></div><div><label>Lieferant / Shop *</label><input name="supplier" required value="{{o.supplier if o else default_supplier}}"></div></div>{% if can_choose_group %}<div class="field" style="max-width:420px"><label>Gruppe *</label><select name="group_id" required>{% for group in groups %}<option value="{{group.id}}" {% if group_id==group.id %}selected{% endif %}>{{group.name}}</option>{% endfor %}</select></div>{% else %}<div class="info-cell" style="margin:16px 0"><label>Gruppe</label><p>{{group_name}}</p></div>{% endif %}<div class="grid"><div><label>Bestellnummer</label><input name="order_number" value="{{o.order_number if o else ''}}"></div><div><label>Versanddienstleister</label><input name="carrier" placeholder="DHL, DPD, UPS ..." value="{{o.carrier if o else default_carrier}}"></div><div><label>Sendungsnummer</label><input name="tracking_number" value="{{o.tracking_number if o else ''}}"></div><div><label>Bestell-/Warenkorb-Link</label><input name="link" type="url" value="{{o.link if o else ''}}"></div><div><label>Status</label><select name="status">{% for s in statuses %}{% if s!='Abgeholt' or (o and o.status=='Abgeholt') %}<option value="{{s}}" {% if o and o.status==s %}selected{% endif %}>{{s}}</option>{% endif %}{% endfor %}</select></div></div><label>Notizen</label><textarea name="notes" rows="4">{{o.notes if o else ''}}</textarea><p><button>Speichern</button> <a class="btn secondary" href="{{url_for('detail',oid=o.id) if o else url_for('index')}}">Abbrechen</a></p></form>
